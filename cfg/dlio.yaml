/**:
  ros__parameters:

    version: 1.1.1
    verbose: true
    adaptive: true

    pointcloud:
      deskew: true
      voxelize: true

    imu:
      calibration: true
      intrinsics:
        accel:
          bias: [ 0.0, 0.0, 0.0 ]
          sm: [ 1.,  0.,  0.,
                0.,  1.,  0.,
                0.,  0.,  1. ]
        gyro:
          bias: [ 0.0, 0.0, 0.0 ]
